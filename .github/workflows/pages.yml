# Publishes the in-browser demo (pages/index.html) to GitHub Pages. Run it from the Actions tab.
# Needs Pages turned on (Settings > Pages > Source: GitHub Actions); for a private repository
# that requires GitHub Pro. The demo is shared through the Claude demo page meanwhile.
name: Publish demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
