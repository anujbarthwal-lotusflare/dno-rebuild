/* demo page: the portal is a light, desktop-first console */
:root { color-scheme: light; }
html, body { background: #ffffff; color: #1f2937; }
.demo-badge {
  position: fixed; left: 12px; bottom: 12px; z-index: 900;
  display: flex; align-items: center; gap: 10px;
  padding: 6px 6px 6px 12px; border-radius: 999px;
  background: #1f2937; color: #f9fafb; font: 12px/1.3 'Open Sans', Arial, sans-serif;
  box-shadow: 0 4px 14px rgba(0,0,0,.2);
}
.demo-badge button {
  border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer;
  background: #f9fafb; color: #1f2937; font: 600 12px 'Open Sans', Arial, sans-serif;
}
.demo-badge button:focus-visible, .demo-viewer-head button:focus-visible { outline: 2px solid #5b8def; outline-offset: 2px; }
.demo-viewer {
  position: fixed; inset: 24px; z-index: 1100; display: flex; flex-direction: column;
  background: #ffffff; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden;
}
.demo-viewer-head {
  display: flex; align-items: center; gap: 16px; padding: 10px 16px;
  border-bottom: 1px solid #e5e7eb; font: 14px 'Open Sans', Arial, sans-serif;
}
.demo-viewer-head strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.demo-viewer-head a { color: #1d3e8a; }
.demo-viewer-head button {
  border: 1px solid #d1d5db; background: #ffffff; border-radius: 4px; padding: 4px 12px; cursor: pointer; font: inherit;
}
.demo-viewer iframe, .demo-viewer img { flex: 1; width: 100%; border: 0; object-fit: contain; min-height: 0; }
.demo-viewer pre { flex: 1; margin: 0; padding: 16px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; background: #f9fafb; }
